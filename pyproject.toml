[build-system]
requires = ["setuptools>=75", "wheel>=0.44"]
build-backend = "setuptools.build_meta"


[project]
name = "memsentry"
dynamic = ["version"]
description = "A memory forensics correlation and reporting platform built on Volatility 3."
readme = "README.md"
requires-python = ">=3.11,<3.15"

authors = [
    { name = "Pirasanth V." },
    { name = "Rakeshan K.R.K." },
    { name = "Thilaksan E." }
]

keywords = [
    "memory-forensics",
    "digital-forensics",
    "cybersecurity",
    "volatility3",
    "yara"
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Security",
    "Private :: Do Not Upload"
]


[project.gui-scripts]
memsentry = "memsentry.__main__:main"


[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true


[tool.setuptools.dynamic]
version = { file = ["version.txt"] }


[tool.setuptools.packages.find]
where = ["src"]
include = ["memsentry*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib"
]

markers = [
    "unit: Fast unit tests.",
    "integration: Tests involving multiple components.",
    "gui: Tests requiring PySide6.",
    "volatility: Tests invoking Volatility 3.",
    "slow: Long-running tests."
]


[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
include = [
    "src/**/*.py",
    "tests/**/*.py"
]
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "runtime"
]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "SIM",
    "C4",
    "RUF"
]

ignore = ["E501"]


[tool.ruff.lint.isort]
known-first-party = ["memsentry"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"


[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["memsentry"]
strict = true
warn_unused_configs = true
show_error_codes = true
pretty = true

exclude = [
    "^build/",
    "^dist/",
    "^runtime/"
]


[[tool.mypy.overrides]]
module = [
    "volatility3.*",
    "PySide6.*",
    "networkx.*"
]
ignore_missing_imports = true


[tool.coverage.run]
branch = true
source = ["memsentry"]


[tool.coverage.report]
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:"
]
