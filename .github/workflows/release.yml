name: Test, Build, and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Test (${{ matrix.os }})
    if: github.actor == github.repository_owner
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Linux Qt dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libglib2.0-0 \
            xvfb
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Run tests on Linux
        if: matrix.os == 'ubuntu-latest'
        env:
          QT_QPA_PLATFORM: offscreen
        run: xvfb-run -a python -m pytest --test-os=linux
      - name: Run tests on Windows
        if: matrix.os == 'windows-latest'
        env:
          QT_QPA_PLATFORM: offscreen
          QT_SCALE_FACTOR: "1"
        run: python -m pytest --test-os=windows

  version-check:
    name: Validate release version
    if: github.actor == github.repository_owner
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      should_release: ${{ steps.release.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: python -m pip install --upgrade pip && pip install build packaging
      - name: Read and validate release version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < version.txt)"
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){2}$ ]] || {
            echo "version.txt must contain a valid version such as 0.1.0" >&2
            exit 1
          }
          [[ "$GITHUB_REF_NAME" == "v$VERSION" ]] || {
            echo "The pushed tag ($GITHUB_REF_NAME) must match version.txt (v$VERSION)" >&2
            exit 1
          }
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check whether this is a new release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          LATEST_TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
          LATEST_VERSION="${LATEST_TAG#v}"
          if [[ -z "$LATEST_TAG" ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SHOULD_RELEASE="$(python - "$VERSION" "$LATEST_VERSION" <<'PY'
          from packaging.version import Version
          import sys

          desired, latest = map(Version, sys.argv[1:])
          if desired < latest:
              raise SystemExit(f"version.txt ({desired}) is older than the latest release ({latest})")
          print("true" if desired > latest else "false")
          PY
          )"
          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"

  source-package:
    name: Build Python source packages
    needs: version-check
    if: github.actor == github.repository_owner && needs.version-check.outputs.should_release == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel and source archive
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: memsentry-source-${{ needs.version-check.outputs.version }}
          path: release-assets/*

  build:
    name: Build (${{ matrix.os }})
    needs: version-check
    if: github.actor == github.repository_owner && needs.version-check.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: windows-2022
            platform: windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 curl dpkg-dev
      - name: Install application and build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements-build.txt
          python -m pip install --no-deps -e .
      - name: Build portable application bundle
        run: python scripts/build.py --no-install
      - name: Archive application for combined portable kit
        shell: bash
        run: tar -czf portable-input.tar.gz -C dist MemSentry
      - name: Upload portable kit input
        uses: actions/upload-artifact@v4
        with:
          name: portable-input-${{ matrix.platform }}
          path: portable-input.tar.gz
          retention-days: 1
      - name: Build Debian package, AppImage, and Linux archive
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          mkdir -p release-assets build
          curl --fail --location --retry 3 \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            --output build/appimagetool-x86_64.AppImage
          chmod +x build/appimagetool-x86_64.AppImage
          python scripts/package_linux.py \
            --version "$VERSION" \
            --appimagetool build/appimagetool-x86_64.AppImage
          tar -czf "release-assets/MemSentry-$VERSION-linux-x86_64.tar.gz" \
            -C dist MemSentry
      - name: Build Windows MSI and portable archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          ./scripts/build_msi.ps1 -Version $env:VERSION
          Compress-Archive -Path dist/MemSentry `
            -DestinationPath "release-assets/MemSentry-$env:VERSION-windows-x86_64.zip" `
            -CompressionLevel Optimal
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: memsentry-${{ matrix.platform }}-${{ needs.version-check.outputs.version }}
          path: release-assets/*

  portable-kit:
    name: Assemble configured portable kit
    needs: [version-check, build]
    if: github.actor == github.repository_owner && needs.version-check.outputs.should_release == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: portable-input-linux-x86_64
          path: portable-input/linux
      - uses: actions/download-artifact@v4
        with:
          name: portable-input-windows-x86_64
          path: portable-input/windows
      - name: Assemble Linux, Windows, tools, and workspace
        env:
          VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          tar -xzf portable-input/linux/portable-input.tar.gz -C portable-input/linux
          tar -xzf portable-input/windows/portable-input.tar.gz -C portable-input/windows
          python scripts/package_portable.py \
            --linux-bundle portable-input/linux/MemSentry \
            --windows-bundle portable-input/windows/MemSentry \
            --version "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: memsentry-portable-kit-${{ needs.version-check.outputs.version }}
          path: release-assets/*-portable-kit-x86_64.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version-check, source-package, build, portable-kit]
    if: github.actor == github.repository_owner && needs.version-check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download Ubuntu and Windows packages
        uses: actions/download-artifact@v4
        with:
          pattern: memsentry-*
          path: release-assets
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version-check.outputs.version }}
          name: MemSentry v${{ needs.version-check.outputs.version }}
          body: |
            ## Choose a download

            | File | Use |
            | --- | --- |
            | `MemSentry-<version>-portable-kit-x86_64.zip` | Complete Linux + Windows kit with acquisition tools, YARA rules, and a configured workspace. Extract the entire ZIP to a writable folder. Run `Start-Windows.cmd` on Windows or `sh Start-Linux.sh` on Linux. |
            | `MemSentry-<version>-windows-x86_64.msi` | Windows installer. Run it and follow the setup prompts; launch MemSentry from the Start menu. |
            | `MemSentry-<version>-windows-x86_64.zip` | Windows portable build. Extract the whole folder and run `MemSentry.exe` inside it. |
            | `memsentry_<version>_amd64.deb` | Debian/Ubuntu installer. Run `sudo apt install ./memsentry_<version>_amd64.deb`; then launch from the app menu or run `memsentry`. |
            | `MemSentry-<version>-linux-x86_64.AppImage` | Linux portable app. Run `chmod +x MemSentry-<version>-linux-x86_64.AppImage`, then launch it. |
            | `MemSentry-<version>-linux-x86_64.tar.gz` | Linux portable build. Extract the archive and run `MemSentry/MemSentry`. |

            ## First analysis

            1. In **Cases**, choose a writable workspace and create or open a case.
            2. In **Evidence & Analysis**, register an existing memory image and verify its SHA-256.
            3. In **Overview**, choose **Analyze evidence**, select the image OS, plugins, symbols root, and optional YARA rules.
            4. Review the plugin results, **Artifacts**, **Findings**, and **Activity**.

            The complete portable kit automatically loads `MemSentryCases/env`, selects `MemSentryCases` as the workspace, and keeps preferences there. Move the entire `MemSentry` folder together. It includes the approved local AVML and WinPmem copies and a SHA-256 manifest. Symbols must be supplied for the target image; the kit creates an empty symbols folder. Live capture still requires OS elevation and a compatible host.

            Keep the original memory image unchanged and retain its SHA-256 hash for evidence verification. Linux packages target x86-64 and require compatible system libraries; AppImage may require FUSE on some distributions. The Python wheel and source archive are for Python/development use, not desktop installation. Acquisition tools are included only in the complete portable kit.

            ---

          generate_release_notes: true
          files: release-assets/*
